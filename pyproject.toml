[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-white-cane-lab"
version = "0.1.0"
description = "A hardware-agnostic learning prototype for accessible obstacle awareness."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.10,<5",
  "ultralytics>=8.3,<9",
]

[project.scripts]
smart-cane = "smart_cane.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
